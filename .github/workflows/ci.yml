name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ypacarai
          POSTGRES_PASSWORD: ypacarai
          POSTGRES_DB: ypacarai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ypacarai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ypacarai:ypacarai@127.0.0.1:5433/ypacarai?schema=public
      TEST_DATABASE_URL: postgresql://ypacarai:ypacarai@127.0.0.1:5433/ypacarai_test?schema=public
      SESSION_SECRET: ci-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Create test database
        run: PGPASSWORD=ypacarai psql -h 127.0.0.1 -p 5433 -U ypacarai -d ypacarai -c 'CREATE DATABASE ypacarai_test;'

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
